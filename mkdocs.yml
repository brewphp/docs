site_name: BrewPHP
site_description: A small, Django-inspired PHP framework. Easy to learn, readable core, zero runtime dependencies.
site_url: https://docs.brewphp.dev/
repo_url: https://github.com/brewphp/brewphp
repo_name: brewphp/brewphp
edit_uri: https://github.com/brewphp/docs/edit/main/docs/
copyright: Copyright &copy; 2026 BrewPHP contributors

theme:
  name: material
  language: en
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Requirements: getting-started/requirements.md
      - Installation: getting-started/installation.md
      - Project structure: getting-started/project-structure.md
      - Configuration: getting-started/configuration.md
  - Topics:
      - Routing: topics/routing.md
      - Views: topics/views.md
      - Requests and responses: topics/requests-responses.md
      - Middleware: topics/middleware.md
      - Models: topics/models.md
      - Making queries: topics/queries.md
      - Databases: topics/databases.md
  - CLI:
      - manage.php: cli/overview.md
  - About:
      - Changelog: changelog.md
      - Contributing: contributing.md
